name: Refresh profile activity

on:
  push:
    paths:
      - .github/workflows/profile-activity.yml
      - scripts/build_activity.py
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'c2451134117-cyber/c2451134117-cyber' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate activity SVGs
        run: python3 scripts/build_activity.py
      - name: Commit changed activity SVGs
        run: |
          git add -- assets/stats.svg assets/languages.svg assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh profile activity SVGs'
          git push
